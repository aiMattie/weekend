name: weekend

services:
  app:
    build: .
    image: weekend:latest
    # set CONTAINER_NAME (and COMPOSE_PROJECT_NAME) in .env to name the stack after your domain
    container_name: ${CONTAINER_NAME:-weekend}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:data/app.db
    ports:
      - "${HOST_PORT:-3058}:3000"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  data:
